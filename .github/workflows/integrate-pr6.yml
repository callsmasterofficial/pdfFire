name: Verify PR6 legacy decryption integration
on:
  push:
    branches: [integrate/pr6-legacy-decryption]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'callsmasterofficial/pdfFire' && github.ref == 'refs/heads/integrate/pr6-legacy-decryption'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Integrate original PR6 retaining current docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/legacy-pdf-decryption --no-tags
          git merge --no-commit --no-ff FETCH_HEAD || true
          conflicts=$(git diff --name-only --diff-filter=U)
          expected=$(printf '%s\n' docs/continuation.md docs/security-findings.md docs/tool-capability-matrix.md process.md)
          if [ "$conflicts" != "$expected" ]; then
            echo "::error::Unexpected conflict set: $conflicts"
            exit 1
          fi
          mkdir -p docs/archives/pr6
          git show FETCH_HEAD:docs/security-findings.md > docs/archives/pr6/security-findings.md
          git show FETCH_HEAD:docs/tool-capability-matrix.md > docs/archives/pr6/tool-capability-matrix.md
          for file in docs/continuation.md docs/security-findings.md docs/tool-capability-matrix.md process.md; do
            git checkout --ours "$file"
            git add "$file"
          done
          git add docs/archives/pr6/security-findings.md docs/archives/pr6/tool-capability-matrix.md
          test -z "$(git ls-files -u)"
          git commit -m "merge: integrate legacy decryption PR6 and archive original audit notes"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Push only successful integration
        run: git push origin HEAD:refs/heads/integrate/pr6-legacy-decryption
