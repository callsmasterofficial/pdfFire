name: Temporary audit remediation
on:
  push:
    branches: [fix/production-dependency-audit]
permissions:
  contents: write
jobs:
  remediate:
    if: github.repository == 'callsmasterofficial/pdfFire' && github.ref == 'refs/heads/fix/production-dependency-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit fix --no-fund --audit-level=high
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): remediate security advisories"
            git push origin HEAD:refs/heads/fix/production-dependency-audit
          fi
